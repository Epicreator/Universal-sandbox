<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<meta name="description" content="Universal Sandbox - an interactive solar system simulator. Spawn planets, meteors, stars and black holes and watch gravity at work.">
<title>Universal Sandbox</title>
<style>
:root{--bg:#02030a;--glass:rgba(12,16,38,.62);--line:rgba(140,160,255,.22);--tx:#e9edff;--mut:#8f9bd1;--ac:#6ea8ff;--ac2:#b07cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sky.armed{cursor:crosshair}
#sky.panning{cursor:grabbing}
.panel{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,.35)}
.bar{position:fixed;left:0;right:0;z-index:5;display:flex;gap:8px;pointer-events:none;padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right))}
.bar>*{pointer-events:auto}
#top{top:0;padding-top:calc(8px + env(safe-area-inset-top));align-items:flex-start;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;padding:6px 14px 6px 8px}
.logo{width:28px;height:28px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,#fff6c8,#ffb43c 45%,#c4490a 100%);box-shadow:0 0 18px 4px rgba(255,170,60,.55)}
.brand b{display:block;font-size:15px;letter-spacing:.3px;background:linear-gradient(90deg,#fff,#9fc2ff 60%,#c9a3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:var(--mut);font-size:11px}
.ctrls{display:flex;align-items:center;gap:4px;padding:4px;flex-wrap:wrap;margin-left:auto}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;min-width:34px;padding:0 10px;border-radius:10px;border:1px solid transparent;background:rgba(120,140,255,.10);color:var(--tx);font:inherit;cursor:pointer;white-space:nowrap}
.b:hover{background:rgba(120,140,255,.24)}
.b:active{transform:scale(.95)}
.b.on{border-color:var(--ac);background:rgba(110,168,255,.26)}
.b i{font-style:normal;font-size:15px;line-height:1}
.pill{min-width:44px;text-align:center;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}
#foot{bottom:0;flex-direction:column;align-items:stretch;padding-bottom:calc(8px + env(safe-area-inset-bottom));gap:6px}
#hud{align-self:flex-start;padding:5px 12px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
#hud b{color:var(--tx);font-weight:600}
#dock{display:flex;gap:6px;padding:6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#dock::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 13px 0 9px;border-radius:12px;border:1px solid transparent;background:rgba(120,140,255,.10);color:var(--tx);font:inherit;cursor:pointer;white-space:nowrap}
.chip:hover{background:rgba(120,140,255,.24)}
.chip.on{border-color:var(--ac2);background:rgba(176,124,255,.26);box-shadow:0 0 16px rgba(176,124,255,.4)}
.chip .dot{width:18px;height:18px;border-radius:50%;box-shadow:inset -3px -3px 5px rgba(0,0,0,.45)}
.chip.move .dot{box-shadow:none;background:none;font-size:15px;width:auto;height:auto}
#hint{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;padding:9px 16px;max-width:min(92vw,520px);text-align:center;color:var(--tx);font-size:13px;opacity:0;transition:opacity .35s;pointer-events:none}
#hint.show{opacity:1}
@media (max-width:760px){
  .b span{display:none}
  .b{padding:0 9px}
  .brand small{display:none}
  .brand{padding:5px 11px 5px 7px}
  .chip{height:36px;padding:0 11px 0 8px}
}
@media (max-height:480px){
  .b span{display:none}
  .b{padding:0 9px}
  .brand small{display:none}
  #hud{padding:3px 10px}
  #hint{bottom:calc(98px + env(safe-area-inset-bottom))}
  .logo{width:22px;height:22px}
  .b{height:30px}
  .chip{height:32px}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<header id="top" class="bar">
  <div class="brand panel"><div class="logo"></div><div><b>Universal Sandbox</b><small>Solar System Simulator</small></div></div>
  <div class="ctrls panel" role="toolbar" aria-label="Simulation controls">
    <button class="b" id="bPause" title="Pause / Play (Space)"><i>⏸</i><span>Pause</span></button>
    <button class="b" id="bSlow" title="Slower (-)"><i>⏪</i></button>
    <span class="pill" id="spd">1×</span>
    <button class="b" id="bFast" title="Speed up (+)"><i>⏩</i><span>Speed up</span></button>
    <span class="sep"></span>
    <button class="b" id="bAdd" title="Add a random planet"><i>＋</i><span>Add planet</span></button>
    <button class="b on" id="bTrail" title="Orbit trails (T)"><i>〰</i><span>Trails</span></button>
    <button class="b" id="bLabel" title="Names (L)"><i>🏷</i><span>Names</span></button>
    <button class="b" id="bFit" title="Re-centre view"><i>⌖</i><span>Centre</span></button>
    <span class="sep"></span>
    <button class="b" id="bClear" title="Remove everything except the Sun"><i>🧹</i><span>Clear</span></button>
    <button class="b" id="bReset" title="Reset (R)"><i>↻</i><span>Reset</span></button>
  </div>
</header>

<footer id="foot" class="bar">
  <div id="hud" class="panel"></div>
  <div id="dock" class="panel" role="toolbar" aria-label="Spawn menu"></div>
</footer>
<div id="hint" class="panel"></div>
<noscript><p style="position:fixed;top:40%;width:100%;text-align:center">Please enable JavaScript to run Universal Sandbox.</p></noscript>

<script>
(()=>{
'use strict';
/* ================= constants ================= */
const G=1, SUN_M=100000, SOFT=16, DT=0.005, MAX_BODIES=220, MAX_STEPS=1500, DRAG_K=0.7, VMAX=160, ESCAPE=9000;
const SPEEDS=[0.25,0.5,1,2,4,8,16,32];
const EARTH_YEAR=2*Math.PI*Math.sqrt(Math.pow(145,3)/(G*SUN_M));   // seconds of sim time

const TYPES={
  mercury:{name:'Mercury',kind:'planet',r:3.6,m:.5, color:'#a9a39b'},
  venus:  {name:'Venus',  kind:'planet',r:6,  m:4,  color:'#e8c47c'},
  earth:  {name:'Earth',  kind:'planet',r:6.6,m:5,  color:'#3f8cff'},
  mars:   {name:'Mars',   kind:'planet',r:4.6,m:.7, color:'#dd5a3a'},
  jupiter:{name:'Jupiter',kind:'planet',r:15, m:150,color:'#d9a76b'},
  saturn: {name:'Saturn', kind:'planet',r:12.5,m:45,color:'#e8d29c'},
  meteor: {name:'Meteor', kind:'meteor',r:2,  m:.02,color:'#b8b2a8'},
  comet:  {name:'Comet',  kind:'comet', r:3,  m:.05,color:'#aee6ff'},
  star:   {name:'Star',   kind:'star',  r:14, m:20000,color:'#ff8a3d'},
  blackhole:{name:'Black hole',kind:'bh',r:7, m:30000,color:'#000000',dot:'radial-gradient(circle,#000 42%,#ffa347 56%,rgba(255,163,71,0) 72%)'},
  sun:    {name:'Sun',    kind:'sun',   r:22, m:SUN_M,color:'#ffcf4a'}
};
const SYSTEM=[['mercury',70,.3],['venus',105,2.1],['earth',145,4.4],['mars',190,1.2],['jupiter',270,5.6],['saturn',350,3.0]];
const DOCK=['mercury','venus','earth','mars','jupiter','saturn','meteor','comet','star','blackhole'];
const PLANETS=['mercury','venus','earth','mars','jupiter','saturn'];

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function mix(h,t,a){const c=hex2rgb(h),d=hex2rgb(t);return'rgb('+c.map((v,i)=>Math.round(v+(d[i]-v)*a)).join(',')+')';}
function rgba(h,a){const c=hex2rgb(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
for(const k in TYPES){const t=TYPES[k];t.lt=mix(t.color,'#ffffff',.55);t.dk=mix(t.color,'#000000',.62);}

/* ================= state ================= */
const cv=$('#sky'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,bgc=null,NOW=0;
const cam={x:0,y:0,z:.4,user:false};
const bodies=[],parts=[];
let idc=1,paused=false,si=2,acc=0,simTime=0,stepN=0,showTrails=true,showLabels=false,armed=null;
const stars=[];for(let i=0;i<280;i++){const z=.15+Math.random()*.85;stars.push({x:Math.random(),y:Math.random(),z,s:.5+z*1.3,ph:Math.random()*6.28,sp:.6+Math.random()*2.2,c:['#ffffff','#cfe0ff','#ffe6c8'][i%3]});}

/* ================= bodies ================= */
function mk(k,x,y,vx,vy,user){
  const t=TYPES[k];
  const b={id:idc++,k,kind:t.kind,name:t.name,x,y,vx,vy,ax:0,ay:0,oax:0,oay:0,m:t.m,r:t.r,user:!!user,dead:false,
           tl:t.kind==='meteor'?40:t.kind==='comet'?120:300,th:0,tc:0};
  b.tx=new Float32Array(b.tl*2);
  return b;
}
function spawn(k,x,y,vx,vy,user){
  if(bodies.length>=MAX_BODIES){say('Space is full ('+MAX_BODIES+' bodies). Press Clear or Reset.');return null;}
  const b=mk(k,x,y,vx,vy,user);bodies.push(b);computeAcc();return b;
}
function dominant(x,y){          // body with the strongest pull at (x,y)
  let best=null,bs=-1;
  for(const b of bodies){const dx=b.x-x,dy=b.y-y,d2=dx*dx+dy*dy+SOFT;const s=b.m/d2;if(s>bs){bs=s;best=b;}}
  return best;
}
function circularVelocity(x,y){
  const a=dominant(x,y);if(!a)return{vx:0,vy:0};
  const dx=x-a.x,dy=y-a.y,d=Math.max(Math.hypot(dx,dy),8);
  const v=Math.sqrt(G*a.m/d);
  return{vx:a.vx+(-dy/d)*v,vy:a.vy+(dx/d)*v};
}
function initSystem(){
  bodies.length=0;parts.length=0;idc=1;simTime=0;acc=0;stepN=0;
  const sun=mk('sun',0,0,0,0,false);bodies.push(sun);
  let px=0,py=0;
  for(const[k,r,a]of SYSTEM){
    const v=Math.sqrt(G*SUN_M/r),b=mk(k,Math.cos(a)*r,Math.sin(a)*r,-Math.sin(a)*v,Math.cos(a)*v,false);
    bodies.push(b);px+=b.m*b.vx;py+=b.m*b.vy;
  }
  sun.vx=-px/SUN_M;sun.vy=-py/SUN_M;       // keep the barycentre still
  computeAcc();
}

/* ================= physics ================= */
function computeAcc(){
  const n=bodies.length;
  for(let i=0;i<n;i++){bodies[i].ax=0;bodies[i].ay=0;}
  for(let i=0;i<n;i++){
    const a=bodies[i];
    for(let j=i+1;j<n;j++){
      const b=bodies[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+SOFT,inv=G/(d2*Math.sqrt(d2));
      const fa=b.m*inv,fb=a.m*inv;
      a.ax+=dx*fa;a.ay+=dy*fa;b.ax-=dx*fb;b.ay-=dy*fb;
    }
  }
}
function stepOnce(dt){
  const n=bodies.length,h=.5*dt*dt;
  for(let i=0;i<n;i++){const b=bodies[i];b.oax=b.ax;b.oay=b.ay;b.x+=b.vx*dt+b.ax*h;b.y+=b.vy*dt+b.ay*h;}
  computeAcc();
  for(let i=0;i<n;i++){const b=bodies[i];b.vx+=.5*(b.oax+b.ax)*dt;b.vy+=.5*(b.oay+b.ay)*dt;}
  simTime+=dt;stepN++;
  if((stepN&3)===0)collide();
  if((stepN&7)===0&&showTrails)for(let i=0;i<bodies.length;i++){const b=bodies[i];if(b.kind!=='sun')pushTrail(b);}
}
function pushTrail(b){const i=b.th;b.tx[i*2]=b.x;b.tx[i*2+1]=b.y;b.th=(i+1)%b.tl;if(b.tc<b.tl)b.tc++;}
function absorb(a,b){
  const M=a.m+b.m;
  a.x=(a.x*a.m+b.x*b.m)/M;a.y=(a.y*a.m+b.y*b.m)/M;
  a.vx=(a.vx*a.m+b.vx*b.m)/M;a.vy=(a.vy*a.m+b.vy*b.m)/M;
  a.m=M;a.r=Math.cbrt(a.r*a.r*a.r+b.r*b.r*b.r*.8);
  if(a.kind==='bh')a.r=Math.min(a.r,22);
  b.dead=true;
  burst(b.x,b.y,TYPES[b.k].color==='#000000'?'#ffa347':TYPES[b.k].color,b.kind==='meteor'?7:18);
}
function collide(){
  const n=bodies.length;let any=false;
  for(let i=0;i<n;i++){
    const a=bodies[i];if(a.dead)continue;
    for(let j=i+1;j<n;j++){
      const b=bodies[j];if(b.dead||a.dead)continue;
      const big=a.m>=b.m?a:b,sm=big===a?b:a;
      const rr=(big.kind==='bh'?big.r*2.4:big.r)+sm.r*.4,dx=b.x-a.x,dy=b.y-a.y;
      if(dx*dx+dy*dy<rr*rr){absorb(big,sm);any=true;}
    }
  }
  for(let i=0;i<n;i++){const b=bodies[i];if(!b.dead&&(!isFinite(b.x+b.y)||Math.abs(b.x)>ESCAPE||Math.abs(b.y)>ESCAPE)){b.dead=true;any=true;}}
  if(any){let w=0;for(let i=0;i<bodies.length;i++)if(!bodies[i].dead)bodies[w++]=bodies[i];bodies.length=w;}
}
function burst(x,y,color,n){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rand(15,70);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.5,1.1),max:1.1,color});}
}

/* trajectory preview: heavy bodies move, the test particle is massless */
function predict(x,y,vx,vy){
  const src=bodies.filter(b=>b.m>=3).sort((a,b)=>b.m-a.m).slice(0,24).map(b=>({x:b.x,y:b.y,vx:b.vx,vy:b.vy,m:b.m,r:b.r,ax:0,ay:0}));
  const pts=[];let px=x,py=y,pvx=vx,pvy=vy,hit=false;const dt=.06,n=src.length;
  for(let s=0;s<600;s++){
    for(let i=0;i<n;i++){src[i].ax=0;src[i].ay=0;}
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
      const a=src[i],b=src[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+SOFT,inv=G/(d2*Math.sqrt(d2));
      a.ax+=dx*b.m*inv;a.ay+=dy*b.m*inv;b.ax-=dx*a.m*inv;b.ay-=dy*a.m*inv;
    }
    let tx=0,ty=0;
    for(let i=0;i<n;i++){
      const a=src[i],dx=a.x-px,dy=a.y-py,d2=dx*dx+dy*dy+SOFT,inv=G*a.m/(d2*Math.sqrt(d2));
      tx+=dx*inv;ty+=dy*inv;
      if(d2<a.r*a.r){hit=true;break;}
    }
    if(hit)break;
    pvx+=tx*dt;pvy+=ty*dt;px+=pvx*dt;py+=pvy*dt;
    for(let i=0;i<n;i++){const a=src[i];a.vx+=a.ax*dt;a.vy+=a.ay*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;}
    if(s%2===0)pts.push(px,py);
    if(Math.abs(px)>ESCAPE||Math.abs(py)>ESCAPE)break;
  }
  if(hit)pts.push(px,py);
  return{pts,hit};
}

/* ================= view ================= */
const toWorld=(sx,sy)=>({x:(sx-W/2)/cam.z+cam.x,y:(sy-H/2)/cam.z+cam.y});
function zoomAt(sx,sy,f){const w=toWorld(sx,sy);cam.z=clamp(cam.z*f,.1,8);cam.x=w.x-(sx-W/2)/cam.z;cam.y=w.y-(sy-H/2)/cam.z;cam.user=true;}
function fit(){cam.x=0;cam.y=0;cam.z=clamp(Math.min(W-30,H-130)/740,.12,2);cam.user=false;}
function buildBg(){
  bgc=document.createElement('canvas');bgc.width=Math.max(1,Math.round(W*DPR));bgc.height=Math.max(1,Math.round(H*DPR));
  const c=bgc.getContext('2d');c.scale(DPR,DPR);
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#03040d');g.addColorStop(1,'#070a1d');c.fillStyle=g;c.fillRect(0,0,W,H);
  [[.18,.3,.5,'rgba(100,70,220,.16)'],[.82,.68,.55,'rgba(30,130,210,.13)'],[.55,.08,.4,'rgba(210,70,150,.08)'],[.3,.95,.45,'rgba(60,200,170,.07)']].forEach(([x,y,r,col])=>{
    const R=Math.max(W,H)*r,n=c.createRadialGradient(x*W,y*H,0,x*W,y*H,R);n.addColorStop(0,col);n.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=n;c.fillRect(0,0,W,H);});
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth||innerWidth;H=cv.clientHeight||innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);buildBg();if(!cam.user)fit();
}
new ResizeObserver(resize).observe(cv);window.addEventListener('resize',resize);

/* ================= drawing ================= */
function nearestStar(x,y){let best=null,bd=1e18;for(const b of bodies){if(b.kind==='sun'||b.kind==='star'){const d=(b.x-x)*(b.x-x)+(b.y-y)*(b.y-y);if(d<bd){bd=d;best=b;}}}return best;}
const starGlow=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.25,'rgba(190,210,255,.28)');g.addColorStop(1,'rgba(150,180,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return c;})();
function drawStars(){
  for(const s of stars){
    const px=(((s.x*W-cam.x*cam.z*.05*s.z)%W)+W)%W,py=(((s.y*H-cam.y*cam.z*.05*s.z)%H)+H)%H;
    const tw=.5+.5*Math.sin(NOW*s.sp+s.ph),a=(.3+.7*tw)*(.35+.65*s.z);
    ctx.globalAlpha=a;ctx.fillStyle=s.c;ctx.fillRect(px,py,s.s,s.s);
    if(s.s>1.5){ctx.globalAlpha=a*.55;const R=s.s*4;ctx.drawImage(starGlow,px+s.s/2-R,py+s.s/2-R,R*2,R*2);}
  }
  ctx.globalAlpha=1;
}
function drawTrail(b){
  if(b.tc<2||b.kind==='sun')return;
  const n=b.tc,start=(b.th-n+b.tl)%b.tl,col=TYPES[b.k].color==='#000000'?'#ff9a3c':TYPES[b.k].color,total=n+1;
  ctx.lineWidth=(b.kind==='meteor'?1.2:1.6)/cam.z;ctx.lineJoin='round';
  for(let c=0;c<4;c++){
    const i0=Math.floor(c*total/4),i1=Math.min(total-1,Math.floor((c+1)*total/4)+1);
    ctx.strokeStyle=rgba(col,(c+1)/4*.55);ctx.beginPath();
    for(let i=i0;i<=i1;i++){
      let x,y;if(i<n){const k=((start+i)%b.tl)*2;x=b.tx[k];y=b.tx[k+1];}else{x=b.x;y=b.y;}
      i===i0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
}
function glow(x,y,r0,r1,col,a){
  const g=ctx.createRadialGradient(x,y,r0,x,y,r1);g.addColorStop(0,rgba(col,a));g.addColorStop(.3,rgba(col,a*.32));g.addColorStop(1,rgba(col,0));
  ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r1,0,6.283);ctx.fill();ctx.globalCompositeOperation='source-over';
}
function drawSun(b){
  const t=TYPES[b.k],r=b.r,pulse=1+.035*Math.sin(NOW*2.1+b.id);
  glow(b.x,b.y,r*.7,r*(b.kind==='sun'?6.2:5)*pulse,t.color,.6);
  const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.35,t.lt);g.addColorStop(.8,t.color);g.addColorStop(1,t.dk);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,r,0,6.283);ctx.fill();
}
function drawBH(b){
  const r=b.r;
  glow(b.x,b.y,r,r*7,'#7a4dff',.28);
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(.5+NOW*.05);
  ctx.globalCompositeOperation='lighter';
  ctx.lineWidth=r*.55;ctx.strokeStyle='rgba(255,150,60,.55)';ctx.beginPath();ctx.ellipse(0,0,r*2.4,r*.85,0,0,6.283);ctx.stroke();
  ctx.lineWidth=r*.18;ctx.strokeStyle='rgba(255,235,200,.75)';ctx.beginPath();ctx.ellipse(0,0,r*2.0,r*.7,0,0,6.283);ctx.stroke();
  ctx.globalCompositeOperation='source-over';ctx.restore();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(b.x,b.y,r*1.02,0,6.283);ctx.fill();
  ctx.strokeStyle='rgba(255,210,150,.5)';ctx.lineWidth=1/cam.z;ctx.stroke();
}
function ring(x,y,r,a0,a1){
  ctx.save();ctx.translate(x,y);ctx.rotate(-.38);
  ctx.lineWidth=r*.34;ctx.strokeStyle='rgba(224,200,150,.55)';ctx.beginPath();ctx.ellipse(0,0,r*1.9,r*.55,0,a0,a1);ctx.stroke();
  ctx.lineWidth=r*.12;ctx.strokeStyle='rgba(255,240,200,.5)';ctx.beginPath();ctx.ellipse(0,0,r*2.25,r*.66,0,a0,a1);ctx.stroke();
  ctx.restore();
}
function drawPlanet(b){
  const t=TYPES[b.k],r=Math.max(b.r,2/cam.z),x=b.x,y=b.y,s=nearestStar(x,y);
  let lx=-.6,ly=-.6;if(s){const dx=s.x-x,dy=s.y-y,d=Math.hypot(dx,dy)||1;lx=dx/d;ly=dy/d;}
  if(b.k==='saturn')ring(x,y,r,Math.PI,2*Math.PI);
  const g=ctx.createRadialGradient(x+lx*r*.45,y+ly*r*.45,r*.08,x,y,r*1.05);
  g.addColorStop(0,t.lt);g.addColorStop(.55,t.color);g.addColorStop(1,t.dk);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();
  if(b.k==='jupiter'||b.k==='earth'||b.k==='venus'){
    ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.clip();
    if(b.k==='jupiter'){[[-.62,.14,'rgba(150,92,52,.38)'],[-.28,.12,'rgba(245,225,190,.3)'],[.08,.18,'rgba(160,96,56,.4)'],[.46,.13,'rgba(240,215,175,.28)']].forEach(([o,h,c])=>{ctx.fillStyle=c;ctx.fillRect(x-r,y+o*r,r*2,h*r);});}
    else if(b.k==='earth'){ctx.fillStyle='rgba(76,176,98,.85)';ctx.beginPath();ctx.ellipse(x-r*.25,y-r*.15,r*.42,r*.3,.6,0,6.283);ctx.fill();ctx.beginPath();ctx.ellipse(x+r*.38,y+r*.3,r*.28,r*.22,-.4,0,6.283);ctx.fill();ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(x+r*.1,y-r*.6,r*.5,r*.1,0,0,6.283);ctx.fill();}
    else{ctx.fillStyle='rgba(255,245,215,.22)';ctx.fillRect(x-r,y-r*.2,r*2,r*.25);}
    ctx.restore();
    if(b.k==='earth'){ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(120,185,255,.35)';ctx.lineWidth=r*.28;ctx.beginPath();ctx.arc(x,y,r*1.08,0,6.283);ctx.stroke();ctx.globalCompositeOperation='source-over';}
  }
  if(b.k==='saturn')ring(x,y,r,0,Math.PI);
}
function drawMeteor(b){
  const r=Math.max(b.r,1.6/cam.z);
  const g=ctx.createRadialGradient(b.x-r*.3,b.y-r*.3,0,b.x,b.y,r);g.addColorStop(0,'#e4ded2');g.addColorStop(1,'#6e675d');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,r,0,6.283);ctx.fill();
}
function drawComet(b){
  const s=nearestStar(b.x,b.y);let dx=b.x-(s?s.x:0),dy=b.y-(s?s.y:0);const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
  const len=clamp(9000/d,18,120),px=-dy,py=dx,r=Math.max(b.r,2/cam.z);
  const g=ctx.createLinearGradient(b.x,b.y,b.x+dx*len,b.y+dy*len);g.addColorStop(0,'rgba(190,235,255,.8)');g.addColorStop(1,'rgba(190,235,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(b.x+px*r*1.3,b.y+py*r*1.3);ctx.lineTo(b.x+dx*len,b.y+dy*len);ctx.lineTo(b.x-px*r*1.3,b.y-py*r*1.3);ctx.closePath();ctx.fill();
  glow(b.x,b.y,0,r*4,'#aee6ff',.55);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,r*.8,0,6.283);ctx.fill();
}
function drawBody(b){
  switch(b.kind){case'sun':case'star':drawSun(b);break;case'bh':drawBH(b);break;case'planet':drawPlanet(b);break;case'meteor':drawMeteor(b);break;case'comet':drawComet(b);break;}
}

/* ================= input ================= */
const ptr=new Map();let placing=null,pan=null,pinch=null,preview=null;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function launchVector(){          // current launch velocity for the object being placed
  const p=placing,w0=toWorld(p.sx,p.sy),dx=p.cx-p.sx,dy=p.cy-p.sy;
  if(Math.hypot(dx,dy)<10){const v=circularVelocity(w0.x,w0.y);return{x:w0.x,y:w0.y,vx:v.vx,vy:v.vy,orbit:true};}
  let vx=dx/cam.z*DRAG_K,vy=dy/cam.z*DRAG_K;const sp=Math.hypot(vx,vy);if(sp>VMAX){vx*=VMAX/sp;vy*=VMAX/sp;}
  return{x:w0.x,y:w0.y,vx,vy,orbit:false};
}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});hideHint();
  if(ptr.size===2){placing=null;pan=null;preview=null;const[a,b]=[...ptr.values()];pinch={d:dist(a,b)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};return;}
  if(ptr.size>2)return;
  const side=e.button===1||e.button===2;
  if(armed&&!side){placing={sx:e.clientX,sy:e.clientY,cx:e.clientX,cy:e.clientY};}
  else{pan={x:e.clientX,y:e.clientY};cv.classList.add('panning');}
});
cv.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptr.size>=2){
    const[a,b]=[...ptr.values()],c={x:(a.x+b.x)/2,y:(a.y+b.y)/2},d=dist(a,b)||1;
    zoomAt(c.x,c.y,d/pinch.d);cam.x-=(c.x-pinch.cx)/cam.z;cam.y-=(c.y-pinch.cy)/cam.z;
    pinch.d=d;pinch.cx=c.x;pinch.cy=c.y;return;
  }
  if(placing){placing.cx=e.clientX;placing.cy=e.clientY;}
  else if(pan){cam.x-=(e.clientX-pan.x)/cam.z;cam.y-=(e.clientY-pan.y)/cam.z;pan.x=e.clientX;pan.y=e.clientY;cam.user=true;}
});
function endPointer(e,cancel){
  if(placing&&ptr.size===1&&!cancel){
    placing.cx=e.clientX;placing.cy=e.clientY;
    const L=launchVector();spawn(armed,L.x,L.y,L.vx,L.vy,true);
  }
  ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;
  if(ptr.size===0){placing=null;pan=null;preview=null;cv.classList.remove('panning');}
}
cv.addEventListener('pointerup',e=>endPointer(e,false));
cv.addEventListener('pointercancel',e=>endPointer(e,true));
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:1/1.12);},{passive:false});

/* ================= UI ================= */
const dock=$('#dock'),hint=$('#hint'),hud=$('#hud');
let hintT=0;
function say(msg,ms){hint.textContent=msg;hint.classList.add('show');clearTimeout(hintT);hintT=setTimeout(()=>hint.classList.remove('show'),ms||4200);}
function hideHint(){hint.classList.remove('show');}
function setArmed(k){
  armed=k;
  dock.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',(c.dataset.k||'')===(k||'')));
  cv.classList.toggle('armed',!!k);
  if(k)say('Tap space to put the '+TYPES[k].name+' into orbit - or drag to launch it. A dotted line previews its path.',5200);
  else say('Move mode: drag to pan, pinch / scroll to zoom.',2600);
}
(function buildDock(){
  const mv=document.createElement('button');mv.className='chip move on';mv.dataset.k='';mv.innerHTML='<span class="dot">✋</span>Move';mv.onclick=()=>setArmed(null);dock.appendChild(mv);
  DOCK.forEach(k=>{
    const t=TYPES[k],b=document.createElement('button');b.className='chip';b.dataset.k=k;
    b.innerHTML='<span class="dot" style="background:'+(t.dot||'radial-gradient(circle at 30% 30%,'+t.lt+','+t.color+')')+'"></span>'+t.name;
    b.onclick=()=>setArmed(armed===k?null:k);dock.appendChild(b);
  });
})();
function updSpeed(){$('#spd').textContent=SPEEDS[si]+'×';}
function setPause(p){paused=p;$('#bPause').innerHTML=p?'<i>▶</i><span>Play</span>':'<i>⏸</i><span>Pause</span>';$('#bPause').classList.toggle('on',p);}
function faster(){si=Math.min(SPEEDS.length-1,si+1);updSpeed();}
function slower(){si=Math.max(0,si-1);updSpeed();}
function addPlanet(){
  const k=PLANETS[Math.floor(Math.random()*PLANETS.length)],r=rand(60,420),a=Math.random()*6.283;
  const x=Math.cos(a)*r,y=Math.sin(a)*r,v=circularVelocity(x,y),ecc=rand(.88,1.08),b=spawn(k,x,y,v.vx*ecc,v.vy*ecc,true);
  if(b)say(b.name+' added at '+Math.round(r)+' units from the Sun.',2400);
}
function reset(){initSystem();fit();say('System reset.',1800);}
function clearAll(){
  let sun=bodies.find(b=>b.kind==='sun');
  if(!sun){sun=mk('sun',0,0,0,0,false);}
  sun.x=0;sun.y=0;sun.vx=0;sun.vy=0;sun.m=SUN_M;sun.r=TYPES.sun.r;
  bodies.length=0;bodies.push(sun);parts.length=0;computeAcc();
  say('Only the Sun is left. Pick an object below to build your own system.',3500);
}
$('#bPause').onclick=()=>setPause(!paused);
$('#bFast').onclick=faster;$('#bSlow').onclick=slower;
$('#bAdd').onclick=addPlanet;
$('#bTrail').onclick=function(){showTrails=!showTrails;this.classList.toggle('on',showTrails);if(!showTrails)bodies.forEach(b=>{b.tc=0;b.th=0;});};
$('#bLabel').onclick=function(){showLabels=!showLabels;this.classList.toggle('on',showLabels);};
$('#bFit').onclick=fit;$('#bClear').onclick=clearAll;$('#bReset').onclick=reset;
window.addEventListener('keydown',e=>{
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  const k=e.key;
  if(k===' '){e.preventDefault();setPause(!paused);}
  else if(k==='+'||k==='=')faster();else if(k==='-'||k==='_')slower();
  else if(k==='r'||k==='R')reset();else if(k==='t'||k==='T')$('#bTrail').click();
  else if(k==='l'||k==='L')$('#bLabel').click();else if(k==='Escape')setArmed(null);
});

/* ================= main loop ================= */
let last=performance.now(),hudT=0;
function frame(t){
  const rdt=Math.min(.05,(t-last)/1000);last=t;NOW=t/1000;
  if(!paused){
    acc+=rdt*SPEEDS[si];let n=0;
    while(acc>=DT&&n<MAX_STEPS){stepOnce(DT);acc-=DT;n++;}
    if(n>=MAX_STEPS)acc=0;
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=rdt;if(p.life<=0){parts.splice(i,1);continue;}p.x+=p.vx*rdt;p.y+=p.vy*rdt;}

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.drawImage(bgc,0,0,W,H);
  drawStars();
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(cam.z,cam.z);ctx.translate(-cam.x,-cam.y);
  if(showTrails)for(const b of bodies)drawTrail(b);
  for(const b of bodies)if(!b.dead)drawBody(b);
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){ctx.fillStyle=rgba(p.color,clamp(p.life/p.max,0,1));ctx.beginPath();ctx.arc(p.x,p.y,2.2/cam.z+1,0,6.283);ctx.fill();}
  ctx.globalCompositeOperation='source-over';

  let label=null;
  if(placing&&armed){
    const L=launchVector(),pr=predict(L.x,L.y,L.vx,L.vy),p=pr.pts;
    ctx.setLineDash([5/cam.z,6/cam.z]);ctx.lineWidth=1.6/cam.z;ctx.strokeStyle='rgba(160,205,255,.8)';
    ctx.beginPath();ctx.moveTo(L.x,L.y);for(let i=0;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.stroke();ctx.setLineDash([]);
    if(pr.hit&&p.length){const ex=p[p.length-2],ey=p[p.length-1],s=5/cam.z;ctx.strokeStyle='#ff6b6b';ctx.lineWidth=2/cam.z;ctx.beginPath();ctx.moveTo(ex-s,ey-s);ctx.lineTo(ex+s,ey+s);ctx.moveTo(ex+s,ey-s);ctx.lineTo(ex-s,ey+s);ctx.stroke();}
    if(!L.orbit){const w1=toWorld(placing.cx,placing.cy);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1.5/cam.z;ctx.beginPath();ctx.moveTo(L.x,L.y);ctx.lineTo(w1.x,w1.y);ctx.stroke();}
    ctx.globalAlpha=.7;drawBody(mk(armed,L.x,L.y,0,0,false));ctx.globalAlpha=1;
    label={x:placing.cx,y:placing.cy,txt:L.orbit?'circular orbit':'speed '+Math.round(Math.hypot(L.vx,L.vy))};
  }
  ctx.restore();

  if(showLabels||label){
    ctx.font='600 11px system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle='rgba(225,232,255,.82)';
    if(showLabels)for(const b of bodies){
      if(b.kind==='meteor')continue;
      const sx=(b.x-cam.x)*cam.z+W/2,sy=(b.y-cam.y)*cam.z+H/2;
      if(sx<-40||sx>W+40||sy<-20||sy>H+20)continue;
      ctx.fillText(b.name,sx,sy-Math.max(b.r,2/cam.z)*cam.z-(b.k==='saturn'?10:8)*Math.max(1,Math.min(1.6,cam.z)));
    }
    if(label){ctx.fillStyle='#fff';ctx.fillText(label.txt,label.x,label.y-18);}
  }
  hudT-=rdt;if(hudT<=0){hudT=.15;hud.innerHTML='Bodies <b>'+bodies.length+'</b> &nbsp;·&nbsp; Earth years <b>'+(simTime/EARTH_YEAR).toFixed(2)+'</b>'+(paused?' &nbsp;·&nbsp; <b>paused</b>':'');}
  requestAnimationFrame(frame);
}

/* ================= start ================= */
resize();initSystem();updSpeed();fit();
say('Welcome to Universal Sandbox! Pick an object below, then tap or drag in space.',6500);
requestAnimationFrame(frame);
window.__US={bodies,step:n=>{for(let i=0;i<n;i++)stepOnce(DT);},get simTime(){return simTime;},EARTH_YEAR,setArmed,cam,addPlanet,reset,clearAll,SPEEDS};
})();
</script>
</body>
</html>
